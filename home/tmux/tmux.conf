set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g default-terminal "tmux-256color"
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g mouse off
setw -g mode-keys vi
set -s escape-time 0
# disableConfirmationPrompt = true  →
bind-key & kill-window
bind-key x kill-pane

# Secondary prefix
set -g prefix2 C-b
bind C-b send-prefix -2

# Session management
bind C-c new-session
bind C-c command-prompt -p "New session name:" "new-session -s '%%'"
bind BTab switch-client -l

# Window/pane creation retaining current path
# bind c new-window -c "#{pane_current_path}"
# bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# bind _ split-window -h -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Window navigation
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# Window movement (prefix > > and prefix < <)
bind > switch-client -T move-right
bind -T move-right > swap-window -d -t +1
bind < switch-client -T move-left
bind -T move-left < swap-window -d -t -1

# Copy mode
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# Buffer management
bind b list-buffers
bind p paste-buffer -p
bind P choose-buffer

# Custom: kill session and switch to next
bind C-x run-shell "~/.local/bin/tmux-kill-session.sh"

# Session behavior
set -g detach-on-destroy off

# Reload source-file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded"

# General settings
set -sg repeat-time 600
set -s focus-events on
setw -g automatic-rename on
set -g renumber-windows on
set -g set-titles on
set -g display-panes-time 800
set -g display-time 4000
set -g status-interval 5
set -g monitor-activity on
set -g visual-activity off
  

### Plugins ###
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'chrtistoomey/vim-tmux-navigator'
set -g @plugin 'joshmedeski/t-smart-tmux-session-manager'
set -g @plugin 'Morantron/tmux-fingers'

# Powerkit
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @powerkit_status_position "bottom"
set -g @powerkit_theme "tokyo-night"
set -g @powerkit_theme_variant "night"
set -g @powerkit_plugin_datetime_format "%H:%M %m/%d"
set -g @powerkit_plugins "pomodoro"
set -g @powerkit_plugin_pomodoro_work_duration "25"
set -g @powerkit_plugin_pomodoro_short_break "5"
set -g @powerkit_plugin_pomodoro_keybinding_toggle "C-p"
set -g @powerkit_plugins "pomodoro,external(\"\"|\"$(liftoff 2>/dev/null)\"|\"info-base\"|\"info-base-lighter\"|\"300\"),datetime,group(hostname,cpu,memory,battery,uptime)"

# Resurrect & Continuum
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ssh-split
set -g @plugin 'pschmitt/tmux-ssh-split'
set -g @ssh-split-v-key '"'
set -g @ssh-split-h-key '_'
set -g @ssh-split-w-key 'c'


# Required for TPM to work - this line MUST come last
run '~/.tmux/plugins/tpm/tpm'
